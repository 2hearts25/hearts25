name: Controlled production enrollment smoke
on:
  push:
    branches: [validation/enrollment-release-debcefd]
    paths: [enrollment-production-smoke.mjs]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: node enrollment-production-smoke.mjs
