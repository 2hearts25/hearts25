name: Staff packet validation
on:
  push:
    branches: [validation/enrollment-release-debcefd]
    paths: [staff-packet-ci.sh]
permissions:
  contents: read
jobs:
  packet:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash staff-packet-ci.sh
